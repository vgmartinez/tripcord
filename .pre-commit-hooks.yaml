- id: tripcord-config
  name: tripcord staged configuration scan
  language: golang
  entry: tripcord scan --staged
  pass_filenames: true
  require_serial: true
  always_run: false
  # Tripcord decides what counts as configuration, not a pre-commit files
  # regex: a config file can be found only by its content (a plugin manifest
  # reference) or by a symlink target, not by its own path or extension. The
  # hook runs on every commit with whatever changed, and --staged reports a
  # finding whenever any file in its source set (see docs/pre-commit.md) is
  # among the passed paths, even when that set does not include the path
  # pre-commit matched.
