- id: tripcord-config
  name: tripcord staged configuration scan
  language: golang
  entry: tripcord scan --staged
  pass_filenames: false
  require_serial: true
  always_run: true
  # Tripcord decides what counts as configuration, not a pre-commit files
  # regex: a config file can be found only by its content (a plugin manifest
  # reference) or by a symlink target, not by its own path or extension.
  # pass_filenames: false and always_run: true mean pre-commit invokes the
  # hook on every commit without naming any file: pre-commit's own type and
  # pattern filtering (for example its default types: [file], which excludes
  # a symlink-only change and any path a staged deletion no longer names)
  # would otherwise skip commits this hook must still see. With no path
  # arguments, `tripcord scan --staged` computes its own staged change set
  # from the Git index (see docs/pre-commit.md), covering added, modified,
  # deleted, type-changed, and mode-changed paths, and reports a finding
  # whenever any file in its source set is among them, even when that set
  # does not include the finding's own path.
