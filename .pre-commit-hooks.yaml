- id: tripcord-config
  name: tripcord staged configuration scan
  language: golang
  entry: tripcord scan --staged
  pass_filenames: true
  require_serial: true
  # Keep this in sync with repository paths adapters discover. The hook needs
  # every config and policy edit, while --staged reports only passed paths.
  files: '(?i)(^|/)(\.agents/|\.claude/|\.claude-plugin/|\.codex/|\.cursor/|\.gemini/|\.github/|\.opencode/|\.windsurf/|\.devin/|\.devcontainer/|\.vscode/|\.tripcord/|skills/|agents/|commands/|hooks/|AGENTS\.md$|CLAUDE\.md$|CLAUDE\.local\.md$|GEMINI\.md$|SKILL\.md$|agents\.override\.md$|\.cursorrules$|\.windsurfrules$|\.mcp\.json$|opencode\.jsonc?$|devcontainer\.json$|\.devcontainer\.json$|Dockerfile$)'
