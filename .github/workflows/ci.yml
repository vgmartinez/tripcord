name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: binary
          args: --timeout=5m

  fuzz:
    name: fuzz parsers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Fuzz rule YAML parser
        run: go test ./internal/rules -run '^$' -fuzz '^FuzzParseSpec$' -fuzztime 30s

      - name: Fuzz policy parser
        run: go test ./internal/policy -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s

      - name: Fuzz Claude config parser
        run: go test ./internal/adapters/claude -run '^$' -fuzz '^FuzzParseConfig$' -fuzztime 30s

      - name: Fuzz Codex config parser
        run: go test ./internal/adapters/codex -run '^$' -fuzz '^FuzzParseConfig$' -fuzztime 30s

      - name: Fuzz Cursor config parser
        run: go test ./internal/adapters/cursor -run '^$' -fuzz '^FuzzParseConfig$' -fuzztime 30s

      - name: Fuzz Copilot config parser
        run: go test ./internal/adapters/copilot -run '^$' -fuzz '^FuzzParseConfig$' -fuzztime 30s

      - name: Fuzz Gemini config parser
        run: go test ./internal/adapters/gemini -run '^$' -fuzz '^FuzzParseConfig$' -fuzztime 30s

      - name: Fuzz OpenCode config parser
        run: go test ./internal/adapters/opencode -run '^$' -fuzz '^FuzzParseConfig$' -fuzztime 30s

      - name: Fuzz Windsurf config parser
        run: go test ./internal/adapters/windsurf -run '^$' -fuzz '^FuzzParseConfig$' -fuzztime 30s

      - name: Fuzz devcontainer parser
        run: go test ./internal/adapters/devcontainer -run '^$' -fuzz '^FuzzParseConfig$' -fuzztime 30s

      - name: Fuzz shared-file parser
        run: go test ./internal/adapters/generic -run '^$' -fuzz '^FuzzParseShared$' -fuzztime 30s

  perf:
    name: e2e perf budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Claude hook-heavy settings budget
        env:
          TRIPCORD_PERF_BUDGET: "1"
        run: go test ./internal/adapters/claude -run '^TestDiscoverHookHeavyBudget$' -count 1 -v

  licenses:
    name: dependency licenses (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Build-tagged files pull in different dependencies per OS.
        goos: [linux, darwin, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # v2.0.1. Pinned by commit so a moved tag cannot change the checker.
      - name: Install go-licenses
        run: go install github.com/google/go-licenses/v2@3e084b0caf710f7bfead967567539214f598c0a2

      # Allowlist: anything else, including AGPL, GPL, SSPL, and unknown
      # licenses, fails. GOROOT is set so go-licenses recognizes the
      # standard library under the go.mod toolchain.
      - name: Check licenses
        env:
          GOOS: ${{ matrix.goos }}
        shell: bash
        run: |
          set -euo pipefail
          GOROOT="$(go env GOROOT)" "$(go env GOPATH)/bin/go-licenses" check ./... \
            --include_tests \
            --allowed_licenses=Apache-2.0,MIT,BSD-2-Clause,BSD-3-Clause,ISC

      - name: Reject TruffleHog
        shell: bash
        run: |
          set -euo pipefail
          if go list -m all | grep -i trufflehog; then
            echo "::error::TruffleHog is AGPL-3.0 and must never be linked. See CONTRIBUTING.md."
            exit 1
          fi

  rule-registry:
    name: rule id registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The base must be readable: a missing base fails instead of
      # comparing with an empty registry. A push with no previous commit
      # (an all-zeros before) compares with the merge-base of the
      # default branch. A base that predates rules/REGISTRY compares with
      # an empty registry.
      - name: Registry is append-only
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              if [ -z "$base" ]; then
                echo "::error::pull request event has no base SHA"
                exit 1
              fi
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              if [ -z "$base" ] || [ "$base" = "$zero" ]; then
                if ! base=$(git merge-base HEAD "origin/${DEFAULT_BRANCH}"); then
                  echo "::error::no previous commit and no merge-base with origin/${DEFAULT_BRANCH}"
                  exit 1
                fi
                echo "No previous commit; comparing with merge-base ${base} of origin/${DEFAULT_BRANCH}."
              fi
              ;;
            *)
              echo "::error::unsupported event ${EVENT_NAME}"
              exit 1
              ;;
          esac
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::base commit ${base} is not readable; cannot check the registry"
            exit 1
          fi
          old="$RUNNER_TEMP/REGISTRY.base"
          : > "$old"
          if git cat-file -e "${base}:rules/REGISTRY" 2>/dev/null; then
            git show "${base}:rules/REGISTRY" > "$old"
          else
            echo "Base ${base} has no rules/REGISTRY; comparing with an empty registry."
          fi
          go run ./internal/tools/registrycheck "$old" rules/REGISTRY

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
          inputs: .github/workflows .github/actions

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout the workflows being linted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v1.7.12. The tarball is pinned by its release checksum.
      - name: actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl -fsSL -o "$archive" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint"

  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require Signed-off-by
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "DCO is checked on pull requests; this event is ${EVENT_NAME}."
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "Pull request is missing a base or head SHA." >&2
            exit 1
          fi
          if ! commits_raw=$(git rev-list --reverse --no-merges "${BASE_SHA}..${HEAD_SHA}"); then
            echo "git rev-list failed for ${BASE_SHA}..${HEAD_SHA}." >&2
            exit 1
          fi
          commits=()
          if [ -n "$commits_raw" ]; then
            mapfile -t commits <<< "$commits_raw"
          fi
          if [ "${#commits[@]}" -eq 0 ]; then
            echo "No commits found between ${BASE_SHA} and ${HEAD_SHA}." >&2
            exit 1
          fi
          failed=0
          for commit in "${commits[@]}"; do
            author_name=$(git show -s --format='%an' "$commit")
            author_email=$(git show -s --format='%ae' "$commit")
            expected="${author_name} <${author_email}>"
            signoffs=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$commit")
            if ! printf '%s\n' "$signoffs" | grep -Fxq -- "$expected"; then
              echo "::error::commit ${commit} is missing Signed-off-by: ${expected}"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "Sign off with: git commit -s" >&2
            exit 1
          fi
          echo "DCO sign-off present on ${#commits[@]} commit(s)."

  tripcord-caller:
    name: Tripcord caller
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout the repository being scanned
      pull-requests: read # read pull request reviews
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read pull request reviews
        id: reviews
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            try {
              const pullRequest = context.payload.pull_request;
              if (!pullRequest || !pullRequest.number) {
                core.warning("Tripcord reviews skipped: this event has no pull request.");
                return;
              }
              const { owner, repo } = context.repo;
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pullRequest.number,
                per_page: 100,
              });
              const file = path.join(process.env.RUNNER_TEMP, "tripcord-reviews.json");
              fs.writeFileSync(file, JSON.stringify(reviews));
              core.setOutput("reviews-file", file);
            } catch {
              core.warning("Tripcord reviews skipped: unable to read pull request reviews.");
            }

      - name: Tripcord
        id: tripcord
        continue-on-error: true
        uses: vgmartinez/tripcord/.github/actions/tripcord@141db48dc10a3df719b20cf2f357e184d629c046 # main@141db48 # zizmor: ignore[ref-version-mismatch]
        with:
          path: testdata/ci-caller
          reviews-file: ${{ steps.reviews.outputs.reviews-file }}
          upload-sarif: "false"

      - name: Assert remote scan
        shell: bash
        env:
          TRIPCORD_OUTCOME: ${{ steps.tripcord.outcome }}
          TRIPCORD_EXIT: ${{ steps.tripcord.outputs.scan-exit-code }}
          TRIPCORD_SARIF: ${{ steps.tripcord.outputs.sarif }}
          TRIPCORD_PR_EXIT: ${{ steps.tripcord.outputs.pr-context-exit-code }}
          TRIPCORD_IS_AGENT: ${{ steps.tripcord.outputs.is_agent }}
        run: |
          set -euo pipefail
          echo "assertion outcome=${TRIPCORD_OUTCOME}"
          echo "assertion scan-exit-code=${TRIPCORD_EXIT}"
          echo "assertion pr-context-exit-code=${TRIPCORD_PR_EXIT}"
          echo "assertion is_agent=${TRIPCORD_IS_AGENT}"
          if [ "$TRIPCORD_OUTCOME" != "failure" ]; then
            echo "assertion failed: outcome is not failure" >&2
            exit 1
          fi
          echo "assertion passed: outcome is failure"
          if [ "$TRIPCORD_EXIT" != "1" ]; then
            echo "assertion failed: scan exit-code is not 1" >&2
            exit 1
          fi
          echo "assertion passed: scan exit-code is 1"
          case "$TRIPCORD_PR_EXIT" in
            0|1)
              echo "assertion passed: pr-context exit is ${TRIPCORD_PR_EXIT}"
              ;;
            *)
              echo "assertion failed: pr-context exit ${TRIPCORD_PR_EXIT} is not 0 or 1" >&2
              exit 1
              ;;
          esac
          case "$TRIPCORD_IS_AGENT" in
            true|false)
              echo "assertion passed: pr-context produced is_agent=${TRIPCORD_IS_AGENT}"
              ;;
            *)
              echo "assertion failed: pr-context produced no is_agent output" >&2
              exit 1
              ;;
          esac
          python3 - "$TRIPCORD_SARIF" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as fh:
              doc = json.load(fh)
          hits = []
          for run in doc.get("runs", []):
              for result in run.get("results", []):
                  if result.get("ruleId") != "TC-CFG-001":
                      continue
                  for loc in result.get("locations") or []:
                      uri = (((loc.get("physicalLocation") or {}).get("artifactLocation") or {}).get("uri") or "")
                      norm = uri.replace("\\", "/")
                      if norm == "testdata/ci-caller" or norm.startswith("testdata/ci-caller/"):
                          hits.append(norm)
          if not hits:
              sys.exit("assertion failed: SARIF has no TC-CFG-001 location under testdata/ci-caller/")
          print("assertion passed: SARIF TC-CFG-001 at " + hits[0])
          PY

  local-action:
    name: local action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare scan directory
        shell: bash
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/tripcord-ci"
          mkdir -p -- "$dir"
          printf 'ci scan placeholder\n' > "$dir/README"

      - name: Tripcord
        uses: ./.github/actions/tripcord # zizmor: ignore[self-repository] load this checkout's action
        with:
          path: ${{ runner.temp }}/tripcord-ci
          upload-sarif: "false"
          comment: "false"

      - name: Write TC-CFG-014 deny stub
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/tripcord-deny" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            scan)
              exit 0
              ;;
            pr-context)
              echo "tc_cfg_014=match" >> "$GITHUB_OUTPUT"
              exit 1
              ;;
            *)
              exit 2
              ;;
          esac
          EOF
          chmod +x "${RUNNER_TEMP}/tripcord-deny"

      - id: tripcord-deny
        name: TC-CFG-014 denial fails the action
        continue-on-error: true
        uses: ./.github/actions/tripcord # zizmor: ignore[self-repository] test this checkout's deny handling
        with:
          binary: ${{ runner.temp }}/tripcord-deny
          path: ${{ runner.temp }}/tripcord-ci
          upload-sarif: "false"
          comment: "false"

      - name: Assert TC-CFG-014 denial
        shell: bash
        env:
          TRIPCORD_OUTCOME: ${{ steps.tripcord-deny.outcome }}
          TRIPCORD_TC_CFG_014: ${{ steps.tripcord-deny.outputs.tc-cfg-014 }}
        run: |
          test "$TRIPCORD_OUTCOME" = "failure"
          test "$TRIPCORD_TC_CFG_014" = "match"
          grep -F '::error::tripcord pr-context denied the pull request under TC-CFG-014' .github/actions/tripcord/action.yml
