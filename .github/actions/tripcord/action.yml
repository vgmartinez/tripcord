name: Tripcord scan
description: Build Tripcord, scan coding-agent configuration, and publish GitHub-native findings.
inputs:
  ref:
    description: Git ref of this action's repository to build. Empty builds the checkout that contains the action.
    required: false
    default: ""
  binary:
    description: Existing tripcord binary. When set, the source build is skipped and nothing is downloaded.
    required: false
    default: ""
  path:
    description: Repository path to scan.
    required: false
    default: .
  fail-on:
    description: Inclusive severity passed to tripcord. Empty lets the CLI and policy decide.
    required: false
    default: ""
  upload-sarif:
    description: Upload the SARIF report to GitHub code scanning.
    required: false
    default: "true"
  comment:
    description: Post the Markdown report to a pull request.
    required: false
    default: "false"
  github-token:
    description: Token used for a ref checkout, SARIF upload, and an optional pull-request comment.
    required: false
    default: ${{ github.token }}
  reviews-file:
    description: JSON array of GitHub pull request reviews for pr-context. Empty skips --reviews-file.
    required: false
    default: ""
  base:
    description: Base commit the scan compares a Tripcord embed with (scan --base), so a pull request that removes or weakens the guard fails TC-CFG-016. The checkout must contain it (fetch-depth 0). Empty scans the head alone.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
outputs:
  scan-exit-code:
    description: Exit code from the scans. The job fails with this code after publishing.
    value: ${{ steps.scan.outputs.exit-code }}
  sarif:
    description: Path to the SARIF report.
    value: ${{ steps.paths.outputs.sarif }}
  markdown:
    description: Path to the Markdown report.
    value: ${{ steps.paths.outputs.markdown }}
  is_agent:
    description: pr-context is_agent output.
    value: ${{ steps.pr-context.outputs.is_agent }}
  agents:
    description: pr-context agents output, comma-separated.
    value: ${{ steps.pr-context.outputs.agents }}
  pr-context-exit-code:
    description: Exit code from pr-context.
    value: ${{ steps.pr-context.outputs.exit-code }}
  tc-cfg-014:
    description: TC-CFG-014 outcome from pr-context, when it is not clear.
    value: ${{ steps.pr-context.outputs.tc_cfg_014 }}
runs:
  using: composite
  steps:
    - id: check-path
      shell: bash
      env:
        TRIPCORD_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        # The path is workflow-command data, not a property. Escape %
        # first, then CR and LF, so a crafted path cannot start another
        # command. : (%3A) and , (%2C) are escaped only in properties.
        workflow_data() {
          local data=$1
          data=${data//'%'/'%25'}
          data=${data//$'\r'/'%0D'}
          data=${data//$'\n'/'%0A'}
          printf '%s' "$data"
        }
        if [ -z "$TRIPCORD_PATH" ]; then
          echo "::error::tripcord path is empty"
          exit 1
        fi
        if [ ! -e "$TRIPCORD_PATH" ]; then
          echo "::error::tripcord path does not exist: $(workflow_data "$TRIPCORD_PATH")"
          exit 1
        fi
        if [ ! -d "$TRIPCORD_PATH" ]; then
          echo "::error::tripcord path is not a directory: $(workflow_data "$TRIPCORD_PATH")"
          exit 1
        fi
        # A failed listing is unreadable, not empty. set -e does not
        # abort inside this if, so the status has to be checked itself.
        if ! listing=$(ls -A -- "$TRIPCORD_PATH" 2>/dev/null); then
          echo "::error::tripcord path is unreadable: $(workflow_data "$TRIPCORD_PATH")"
          exit 1
        fi
        if [ -z "$listing" ]; then
          echo "::error::tripcord path is empty: $(workflow_data "$TRIPCORD_PATH")"
          exit 1
        fi
    - id: paths
      shell: bash
      run: |
        echo "sarif=${RUNNER_TEMP}/tripcord.sarif" >> "$GITHUB_OUTPUT"
        echo "markdown=${RUNNER_TEMP}/tripcord.md" >> "$GITHUB_OUTPUT"
    - id: repo
      shell: bash
      env:
        TRIPCORD_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        TRIPCORD_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      run: |
        if [ -n "$TRIPCORD_HEAD_REPO" ] && [ -n "$TRIPCORD_BASE_REPO" ] && [ "$TRIPCORD_HEAD_REPO" != "$TRIPCORD_BASE_REPO" ]; then
          echo "same=false" >> "$GITHUB_OUTPUT"
        else
          echo "same=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Checkout Tripcord ref
      if: inputs.binary == '' && inputs.ref != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.action_repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.github-token }}
        path: tripcord-src
        persist-credentials: false
    - id: source
      if: inputs.binary == ''
      shell: bash
      env:
        TRIPCORD_REF: ${{ inputs.ref }}
        TRIPCORD_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -n "$TRIPCORD_REF" ]; then
          echo "root=${GITHUB_WORKSPACE}/tripcord-src" >> "$GITHUB_OUTPUT"
        else
          root=$(cd "$TRIPCORD_ACTION_PATH/../../.." && pwd)
          echo "root=${root}" >> "$GITHUB_OUTPUT"
        fi
    - name: Setup Go
      if: inputs.binary == ''
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ steps.source.outputs.root }}/go.mod
        cache: true
        cache-dependency-path: ${{ steps.source.outputs.root }}/go.sum
    - id: build
      if: inputs.binary == ''
      shell: bash
      env:
        TRIPCORD_ROOT: ${{ steps.source.outputs.root }}
      run: |
        set -euo pipefail
        cd "$TRIPCORD_ROOT"
        CGO_ENABLED=0 go build -trimpath -o "${RUNNER_TEMP}/tripcord" ./cmd/tripcord
        echo "path=${RUNNER_TEMP}/tripcord" >> "$GITHUB_OUTPUT"
    - id: clean-source
      if: inputs.binary == '' && inputs.ref != ''
      shell: bash
      run: |
        set -euo pipefail
        test -n "${GITHUB_WORKSPACE}"
        rm -rf "${GITHUB_WORKSPACE}/tripcord-src"
    - id: tool
      shell: bash
      env:
        TRIPCORD_BINARY: ${{ inputs.binary }}
        TRIPCORD_BUILT: ${{ steps.build.outputs.path }}
      run: |
        if [ -n "$TRIPCORD_BINARY" ]; then
          case "$TRIPCORD_BINARY" in
            *$'\n'*|*$'\r'*)
              echo "::error::tripcord binary contains a newline"
              exit 1
              ;;
          esac
          echo "path=${TRIPCORD_BINARY}" >> "$GITHUB_OUTPUT"
        else
          echo "path=${TRIPCORD_BUILT}" >> "$GITHUB_OUTPUT"
        fi
    - id: scan
      shell: bash
      env:
        TRIPCORD: ${{ steps.tool.outputs.path }}
        TRIPCORD_PATH: ${{ inputs.path }}
        TRIPCORD_FAIL_ON: ${{ inputs.fail-on }}
        TRIPCORD_BASE: ${{ inputs.base }}
        TRIPCORD_SARIF: ${{ steps.paths.outputs.sarif }}
        TRIPCORD_MARKDOWN: ${{ steps.paths.outputs.markdown }}
        TRIPCORD_INPUT_BINARY: ${{ inputs.binary }}
        TRIPCORD_INPUT_REF: ${{ inputs.ref }}
        TRIPCORD_ACTION_REPOSITORY: ${{ github.action_repository }}
        TRIPCORD_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        TRIPCORD_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        TRIPCORD_WORKFLOW_SHA: ${{ job.workflow_sha }}
      run: |
        set +e
        # Same order as check-path. The base is workflow-command data:
        # escape % first, then CR, then LF, so a crafted base cannot
        # start another command.
        workflow_data() {
          local data=$1
          data=${data//'%'/'%25'}
          data=${data//$'\r'/'%0D'}
          data=${data//$'\n'/'%0A'}
          printf '%s' "$data"
        }
        args=()
        if [ -n "$TRIPCORD_FAIL_ON" ]; then
          args+=(--fail-on "$TRIPCORD_FAIL_ON")
        fi
        if [ -n "$TRIPCORD_BASE" ]; then
          if ! git -C "$TRIPCORD_PATH" rev-parse --git-dir >/dev/null 2>&1; then
            echo "::notice::tripcord path is not a Git repository; scanning without --base"
          else
            if ! git -C "$TRIPCORD_PATH" cat-file -e "${TRIPCORD_BASE}^{commit}" 2>/dev/null; then
              echo "::error::tripcord base commit $(workflow_data "$TRIPCORD_BASE") is not in the checkout; check out with fetch-depth: 0, or set base to an empty string"
            fi
            args+=(--base "$TRIPCORD_BASE")
          fi
        fi
        # --executing-workflow names the reusable workflow this job runs
        # (job.workflow_*, not github.workflow_*, which is the caller). It
        # lets the scan accept a tripcord.yml pin equal to that workflow
        # only when the base pins it too, so it is passed only when this
        # action runs inside this repository's own tripcord-pr.yml (a
        # fork's is not one the scanner accepts), and
        # only to the tripcord built from this action's own source: a
        # binary input or another ref may predate the flag. GHES has no
        # job.workflow_*, so it gets no flag.
        if [ -z "$TRIPCORD_INPUT_BINARY" ] && [ -z "$TRIPCORD_INPUT_REF" ] &&
          [ -n "$TRIPCORD_WORKFLOW_SHA" ] &&
          [ "$TRIPCORD_WORKFLOW_REPOSITORY" = "$TRIPCORD_ACTION_REPOSITORY" ] &&
          [ "$TRIPCORD_WORKFLOW_REPOSITORY" = "vgmartinez/tripcord" ] &&
          [ "$TRIPCORD_WORKFLOW_FILE_PATH" = ".github/workflows/tripcord-pr.yml" ]; then
          args+=(--executing-workflow "${TRIPCORD_WORKFLOW_REPOSITORY}/${TRIPCORD_WORKFLOW_FILE_PATH}@${TRIPCORD_WORKFLOW_SHA}")
        fi
        "$TRIPCORD" scan "$TRIPCORD_PATH" --format gha "${args[@]}"
        status=$?
        "$TRIPCORD" scan "$TRIPCORD_PATH" --format sarif --output "$TRIPCORD_SARIF" "${args[@]}"
        sarif_status=$?
        "$TRIPCORD" scan "$TRIPCORD_PATH" --format md --output "$TRIPCORD_MARKDOWN" "${args[@]}"
        markdown_status=$?
        if [ "$sarif_status" -gt "$status" ]; then status=$sarif_status; fi
        if [ "$markdown_status" -gt "$status" ]; then status=$markdown_status; fi
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        exit 0
    - id: sarif-file
      if: inputs.upload-sarif == 'true' && steps.scan.outputs.exit-code != ''
      shell: bash
      env:
        TRIPCORD_SARIF: ${{ steps.paths.outputs.sarif }}
      run: |
        if [ -f "$TRIPCORD_SARIF" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi
    - id: pr-context
      shell: bash
      env:
        TRIPCORD: ${{ steps.tool.outputs.path }}
        TRIPCORD_PATH: ${{ inputs.path }}
        TRIPCORD_REVIEWS_FILE: ${{ inputs.reviews-file }}
      run: |
        set +e
        if [ -n "$TRIPCORD_REVIEWS_FILE" ]; then
          "$TRIPCORD" pr-context --format gha --repo "$TRIPCORD_PATH" --reviews-file "$TRIPCORD_REVIEWS_FILE"
        else
          "$TRIPCORD" pr-context --format gha --repo "$TRIPCORD_PATH"
        fi
        status=$?
        echo "exit-code=$status" >> "$GITHUB_OUTPUT"
        if [ -z "$TRIPCORD_REVIEWS_FILE" ] && { [ "$status" -eq 3 ] || [ "$status" -eq 4 ]; }; then
          echo "::warning::tripcord pr-context could not make a policy decision (exit ${status}) without reviews-file; the job continues"
        fi
        exit 0
    - name: Upload SARIF
      id: upload-sarif
      if: inputs.upload-sarif == 'true' && steps.scan.outputs.exit-code != '' && steps.repo.outputs.same == 'true' && steps.sarif-file.outputs.present == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.paths.outputs.sarif }}
        token: ${{ inputs.github-token }}
    - name: Warn when SARIF upload is skipped
      if: inputs.upload-sarif == 'true' && steps.scan.outputs.exit-code != '' && (steps.repo.outputs.same != 'true' || steps.sarif-file.outputs.present != 'true' || steps.upload-sarif.outcome == 'failure')
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TRIPCORD_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        TRIPCORD_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        TRIPCORD_SARIF_PRESENT: ${{ steps.sarif-file.outputs.present }}
        TRIPCORD_SARIF_OUTCOME: ${{ steps.upload-sarif.outcome }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          try {
            const head = process.env.TRIPCORD_HEAD_REPO || "";
            const base = process.env.TRIPCORD_BASE_REPO || "";
            if (head !== "" && base !== "" && head !== base) {
              core.warning("Tripcord SARIF upload skipped: pull request head repository differs from the base repository.");
              return;
            }
            if (process.env.TRIPCORD_SARIF_PRESENT !== "true") {
              core.warning("Tripcord SARIF upload skipped: the SARIF file is missing. The scan exited before writing it.");
              return;
            }
            if (process.env.TRIPCORD_SARIF_OUTCOME === "failure") {
              core.warning("Tripcord SARIF upload skipped: the token cannot upload code scanning results.");
            }
          } catch (error) {
            core.warning(`Tripcord SARIF upload skipped: ${error.message}`);
          }
    - name: Comment on pull request
      if: inputs.comment == 'true' && steps.scan.outputs.exit-code != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        TRIPCORD_MARKDOWN: ${{ steps.paths.outputs.markdown }}
        TRIPCORD_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        TRIPCORD_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          try {
            const head = process.env.TRIPCORD_HEAD_REPO || "";
            const base = process.env.TRIPCORD_BASE_REPO || "";
            if (head !== "" && base !== "" && head !== base) {
              core.warning("Tripcord comment skipped: pull request head repository differs from the base repository.");
              return;
            }
            const issueNumber = context.payload.pull_request && context.payload.pull_request.number;
            if (!issueNumber) {
              core.warning("Tripcord comment skipped: this event has no pull request.");
              return;
            }
            const body = fs.readFileSync(process.env.TRIPCORD_MARKDOWN, "utf8");
            const marker = "<!-- tripcord-report -->";
            const report = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            // GET /user accepts a user or PAT. An installation token, including
            // the default GITHUB_TOKEN, is not in that list and returns 403.
            // GraphQL viewer is the authenticated identity and accepts an
            // installation token. If neither answers, skip: do not edit a
            // comment and do not create one, and do not fail the job.
            let actorLogin = "";
            let actorID = null;
            try {
              const me = await github.rest.users.getAuthenticated();
              const actor = me.data || {};
              actorLogin = typeof actor.login === "string" ? actor.login : "";
              actorID = actor.id;
            } catch (error) {
              const status = error.status || (error.response && error.response.status);
              const message = String(error && error.message || "");
              if (status !== 403 && !message.includes("Resource not accessible by integration")) {
                throw error;
              }
              let viewer = null;
              try {
                const result = await github.graphql("query { viewer { login databaseId } }");
                viewer = result && result.viewer;
              } catch (graphqlError) {
                core.warning(`Tripcord comment skipped: the token identity could not be read (${graphqlError.message}).`);
                return;
              }
              if (viewer) {
                actorLogin = typeof viewer.login === "string" ? viewer.login : "";
                actorID = viewer.databaseId;
              }
            }
            if ((actorLogin === "" || actorLogin == null) && actorID == null) {
              core.warning("Tripcord comment skipped: the token identity could not be read.");
              return;
            }
            const owns = comment => {
              const user = comment.user;
              if (!user || typeof comment.body !== "string" || !comment.body.startsWith(marker)) {
                return false;
              }
              if (actorID != null && user.id != null) {
                return user.id === actorID;
              }
              return actorLogin !== "" && user.login === actorLogin;
            };
            const previous = comments.find(owns);
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body: report });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body: report });
            }
          } catch (error) {
            core.warning(`Tripcord comment skipped: ${error.message}`);
          }
    - id: apply-exit-code
      name: Apply scan exit code
      if: steps.scan.outputs.exit-code != ''
      shell: bash
      env:
        TRIPCORD_SCAN_STATUS: ${{ steps.scan.outputs.exit-code }}
        TRIPCORD_PR_CONTEXT_STATUS: ${{ steps.pr-context.outputs.exit-code }}
        TRIPCORD_REVIEWS_FILE: ${{ inputs.reviews-file }}
      run: |
        if [ "$TRIPCORD_SCAN_STATUS" -ne 0 ]; then
          exit "$TRIPCORD_SCAN_STATUS"
        fi
        case "$TRIPCORD_PR_CONTEXT_STATUS" in
          0)
            exit 0
            ;;
          "")
            echo "::error::tripcord pr-context did not report an exit code"
            exit 1
            ;;
          1)
            echo "::error::tripcord pr-context denied the pull request under TC-CFG-014"
            exit 1
            ;;
          3|4)
            if [ -n "$TRIPCORD_REVIEWS_FILE" ]; then
              echo "::error::tripcord pr-context could not validate TC-CFG-014 with reviews-file (exit ${TRIPCORD_PR_CONTEXT_STATUS})"
              exit "$TRIPCORD_PR_CONTEXT_STATUS"
            fi
            exit 0
            ;;
          *)
            echo "::error::tripcord pr-context failed with unexpected exit ${TRIPCORD_PR_CONTEXT_STATUS}"
            exit "$TRIPCORD_PR_CONTEXT_STATUS"
            ;;
        esac
