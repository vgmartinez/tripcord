# corpus/ is defanged fixture text, not a place live credentials are
# stored. The corpus lint rejects real-looking secrets that lack the
# TRIPCORD-FAKE- prefix, and it rejects high-entropy tokens that are not
# an inert <MARKER>. Secret scanning would still report those shapes, so
# this tree is ignored here and checked by the lint instead.
paths-ignore:
  - "corpus/**"
