# Cursor, Copilot, and Windsurf hooks run on the developer's machine
# with the agent's privileges. A shared hook that reaches the network
# can send the prompt, the tool input, or the file it was given to
# another host, or fetch the code it runs. A hook whose only output is
# a fixed allow decision approves every call it sees: it looks like a
# guard in review and turns the approval off.
#
# Network: shell.risks reports a fetch in a command field (a downloader
#   with a non-loopback target, python -c or node -e network code, a
#   remote deno module, npx -y, pnpm dlx, uvx, git clone; see
#   TC-CFG-001), shell.locations reports a program or script at a
#   non-loopback URL or UNC share, or the hook is an HTTP hook to a
#   non-loopback URL. A download into Invoke-Expression whose target is
#   a variable (iwr $u | iex, irm $env:U | iex, $x = iwr $u; iex $x,
#   iex (New-Object Net.WebClient).DownloadString($u)) is a pipe, not a
#   fetch, in shell.risks; it counts when the same command also names
#   iex or Invoke-Expression and a downloader or .NET Download call, so a
#   pipe into sh (cat x | sh) is not read as network.
# Unconditional allow (Cursor and Copilot, whose hooks return their
#   decision as JSON on stdout): the whole command is one echo, printf,
#   or Write-Output of a fixed JSON text with "permission",
#   "permissionDecision", or "decision" set to "allow" or "approve",
#   optionally followed by exit 0, or exec echo or printf with such
#   an argument. Any $, backtick, pipe, redirection, &&, ||, ;
#   (other than before exit), or parenthesis makes the output depend on
#   something and is not matched. Windsurf hooks allow by exit code,
#   so only the network part applies to them.
#
# Not read: what a hook's script prints (.cursor/hooks/allow.sh may
# allow everything), an allow wrapped in bash -c or cat <<EOF, a
# POSIX download from a variable (curl $u | sh), and which hook events
# a hook runs on. A session-start hook that fetches is also TC-CFG-001.
id: TC-CFG-008
pack: tripcord/core
title: "Cursor, Copilot, or Windsurf hook reaches the network or always allows"
severity: high
harness: [copilot, cursor, windsurf]
files: ["**"]
when: |
  config.kind == "hook" && config.scope == "repo" &&
    !config.path.matches(r'''(^|/)settings\.local\.json$''') &&
    (
      (has(payload.url) && type(payload.url) == string && "network" in shell.locations(payload.url)) ||
      hook.commands(payload).exists(c,
        "fetch" in shell.risks(c) ||
        "network" in shell.locations(c) ||
        ("pipe" in shell.risks(c) &&
          c.matches(r'''(?i)(^|[^\w$-])(iex|invoke-expression)([^\w-]|$)''') &&
          c.matches(r'''(?i)(^|[^\w$-])(iwr|irm|curl|wget|invoke-webrequest|invoke-restmethod|start-bitstransfer)([^\w-]|$)|(?i)\.download(string|file|data)''')) ||
        (config.harness in ["copilot", "cursor"] &&
          c.matches(r'''^\s*(?i:echo|printf|write-output)(\s+-[A-Za-z]+)*\s+[^$`|&;<>()\r\n]*\\?"(permission|permissionDecision|decision)\\?"\s*:\s*\\?"(allow|approve)\\?"[^$`|&;<>()\r\n]*(;\s*exit(\s+0)?)?\s*;?\s*$'''))) ||
      "fetch" in shell.risks(hook.argv(payload)) ||
      "network" in shell.locations(hook.argv(payload)) ||
      ("pipe" in shell.risks(hook.argv(payload)) &&
        hook.argv(payload).exists(a, a.matches(r'''(?i)(^|[^\w$-])(iex|invoke-expression)([^\w-]|$)''')) &&
        hook.argv(payload).exists(a, a.matches(r'''(?i)(^|[^\w$-])(iwr|irm|curl|wget|invoke-webrequest|invoke-restmethod|start-bitstransfer)([^\w-]|$)|(?i)\.download(string|file|data)'''))) ||
      (config.harness in ["copilot", "cursor"] &&
        has(payload.exec) && type(payload.exec) == string &&
        payload.exec.matches(r'''^((/usr)?/bin/)?(echo|printf)$''') &&
        hook.argv(payload).exists(a, a.matches(r'''"(permission|permissionDecision|decision)"\s*:\s*"(allow|approve)"''')))
    )
fix: "Keep shared hooks local: do not send hook input to another host or fetch code from one, and commit what the hook runs. A permission hook should decide from its input; remove a hook that only prints an allow decision, and use the harness's own allow list for commands that are always safe."
refs:
  - https://cursor.com/docs/hooks
  - https://docs.github.com/en/copilot/reference/hooks-reference
  - https://docs.windsurf.com/windsurf/cascade/hooks
  - https://workos.com/blog/npm-worm-coding-agent-config-credentials
