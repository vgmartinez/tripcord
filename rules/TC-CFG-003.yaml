# A stdio MCP server is a process the agent starts. When its command is
# a shell, or an interpreter started with an inline-code flag, or the
# command string pipes into a shell, the "server" is an arbitrary script.
# Novee showed that persistence payload at DEF CON 34.
#
# Every MCP server any adapter normalizes is in scope: .mcp.json,
# .cursor/mcp.json, .vscode/mcp.json, Codex mcp_servers, Gemini
# mcpServers, OpenCode's command array, Copilot mcp-config.json, and
# Windsurf mcp_config.json.
#
# The command and its args are read as one command line. OpenCode is
# the only schema whose command is an argv array, and only that array
# is joined. A command array on any other harness is opaque: the entry
# is not evaluated. Its first word decides: a shell (sh, bash, zsh,
# dash, ksh, ash, csh, tcsh, fish, cmd, powershell, pwsh) matches, and
# an interpreter matches only when its inline-code flag comes before any
# script or -m: python -c, node -e/--eval, perl -e, ruby -e, deno eval.
# python -m my_server -c config.yaml and node server.js -e production are
# a server's own flags and do not match. Other flags may come first
# (python -u -c), but not a flag that takes a separate value
# (python -W ignore -c).
#
# A pipe counts only in the command string, or because the command is
# itself a shell. A literal argument of a non-shell executable, such as
# node server.js --filter 'a|sh', does not. The pipe is found by
# shell.risks, with the exemption TC-CFG-001 uses (./x.sh | sh).
#
# shell.mcp unwraps a shell wrapper before that test. cmd /c, /k, and
# /r, sh -c, and bash -c, and the same with a path, .exe, or flag
# cluster (-lc, /s /c) are replaced by the inner command when that
# command is one simple program, or cd <dir> && that program, and the
# program is a literal bare word or path. env, sudo, exec, command, and
# assignments are dropped first, as they are for shell.risks. The inner
# command is then judged by the same shell and inline-interpreter test,
# so bash -c 'npx pkg' and sh -c 'exec node server.js' do not match,
# while bash -c 'node -e ...' still does. The payload is not unwrapped
# when it contains $, %, a backtick, or ^, or, for cmd, when &, |, <,
# or > remains after quotes are removed. A pipe, semicolon, or || that
# the lexer sees, an extra &&, a substitution, a redirection, or a
# downloader (curl, wget, and the other names shell.risks treats as
# downloaders) is not simple either, so the shell stays matched. A |
# hidden by ANSI-C quotes or by cmd quotes stays matched for that
# reason, not because every | character is an operator.
#
# config.repo_script is that filesystem check, made by scriptcheck
# after discovery. It is true only for a repository server whose
# command is a shell wrapper around files that resolve inside the
# scanned tree: bash script.sh, bash -c 'exec "$(git rev-parse
# --show-toplevel)/scripts/x.sh"', the same git toplevel assigned to
# repo and then bun run, powershell -File ./script.ps1, and a short
# loader (set -a, set +a, source or . of one relative path, chmod +x
# of one relative path, xattr -d of one relative path) whose last
# command is one known launcher or a relative file. The signal checks
# where that file is. A script inside the tree is not inspected for
# content. A launcher with no file is only npx, bunx, uvx, uv, pipx,
# pnpm dlx, yarn dlx, npm exec, npm dlx, or bun x. Any other bare
# program stays matched. A $ in program position is not expanded, so
# ${X:-rm} stays matched. cd, pushd, env -C, sudo -D, sudo --chdir,
# and any --cwd or --chdir wrapper stay matched. The one cd that is
# followed is a repository-root cd, and only when all of these hold.
# The git command is exactly V=$(git rev-parse --show-toplevel) or
# cd "$(git rev-parse --show-toplevel)": no other git arguments, no
# git -C, --git-dir, or --work-tree, and no environment prefix
# (GIT_DIR, GIT_WORK_TREE, any GIT_*, or any other VAR=) on that line
# or exported earlier in the command. The cd uses that same variable,
# double-quoted, and the variable is not reassigned between the
# assignment and the cd. Between that cd and the exec there is no
# other cd, pushd, -C, --chdir, or --cwd. The script is still
# relative, inside the tree, has no .., and is not a symlink that
# leaves the tree. || exit 1 after the assignment or the cd is that
# same form. Any other variant leaves repo_script false. The only dotenv
# names are .env, .env.local, and .env.claude. Under set -a one of
# those does not have to be in the tree. When it is, and when the same
# file is sourced without set -a, every line has to be blank, a
# comment (#...), or KEY=VALUE. KEY matches [A-Za-z_][A-Za-z0-9_]* and
# may be prefixed by "export ". VALUE must not contain $, a backtick,
# ;, &, |, <, >, a newline inside quotes, or a trailing backslash. A
# symlink that resolves outside the tree, a file that cannot be read,
# and a file larger than 64 KiB leave repo_script false. Any other
# sourced path is an ordinary file and has to be in the tree. A
# launcher with only
# plain $NAME or ${NAME} arguments (exec npx -y pkg --dsn "$DSN") is
# the same wrapper. A fetch, a pipe, a command substitution, an inline
# interpreter, a path that leaves the tree, and a symlink that resolves
# outside it stay matched. User and managed servers are never
# repo_script.
#
id: TC-CFG-003
pack: tripcord/core
title: "MCP server launched through a shell, a pipe to sh, or an inline interpreter"
severity: high
harness: [claude, codex, copilot, cursor, gemini, opencode, windsurf, vscode]
files: ["**"]
when: |
  config.kind == "mcp-server" &&
    !config.repo_script &&
    (!has(payload.type) || (type(payload.type) == string && payload.type in ["", "stdio", "local"])) &&
    has(payload.command) && (
      [
        type(payload.command) == string ?
          shell.mcp([payload.command] + hook.args(payload)) :
        type(payload.command) == list && config.harness == "opencode" && payload.command.all(a, type(a) == string) ? shell.mcp(payload.command) : ""
      ].exists(h, h.matches(r'''(?i)^\s*(?:[^\s]*[/\\])?(?:(?:(?:ba|z|da|k|a|c|tc|fi)?sh|cmd|powershell|pwsh)(?:\.exe)?(?:\s|$)|python(?:3(?:\.[0-9]+)?)?(?:\.exe)?(?:\s+-[^\sm]\S*)*?\s+-c(?:\s|$)|node(?:\.exe)?(?:\s+-[^\se]\S*)*?\s+(?:-e|--eval)(?:\s|$)|(?:perl|ruby)(?:\.exe)?(?:\s+-[^\se]\S*)*?\s+-e(?:\s|$)|deno(?:\.exe)?\s+eval(?:\s|$))''')) ||
      (type(payload.command) == string && "pipe" in shell.risks(payload.command))
    )
fix: "Point command at the server binary and pass its arguments in args, without a shell, an inline interpreter, or a downloaded script."
refs:
  - https://novee.security/blog/breaking-ai-agent-sandboxes/
  - https://code.visualstudio.com/docs/agents/reference/mcp-configuration
