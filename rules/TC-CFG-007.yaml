# A skill can declare hooks in its SKILL.md frontmatter. Claude Code
# registers them when the skill is invoked and keeps them for the rest
# of the session, including in non-interactive -p runs, where no
# workspace trust prompt is shown. The hook never appears in
# settings.json, so a reviewer who reads the hook configuration does not
# see it.
#
# In scope: hooks in the frontmatter of a SKILL.md in the repository,
# under .claude/skills or the shared .agents/skills and .github/skills
# (the generic harness), and in a Claude plugin's skills directory. Each
# hook is its own finding. Not every tool registers skill hooks; shared
# skills are reported because a tool with Claude Code's skill semantics
# does.
#
# High: the hook also runs something a reviewer cannot read in the
#   repository: shell.risks reports a fetch, pipe, encoded, or nested
#   payload in a command field, shell.locations reports a program or
#   script at a URL, under the home directory, or in a temporary
#   directory, or the hook is an HTTP hook to a non-loopback URL.
# Medium: any other frontmatter hook.
#
# Not read: hooks in agent and command frontmatter (see TC-CFG-006 for
# where they point), hooks in user-scope skills, and what the hook's
# script does.
id: TC-CFG-007
pack: tripcord/core
title: "Skill registers hooks from its frontmatter"
severity: high
severity_when:
  - severity: high
    when: |
      (has(payload.url) && type(payload.url) == string && "network" in shell.locations(payload.url)) ||
        hook.commands(payload).exists(c,
          shell.risks(c).size() > 0 || shell.locations(c).exists(l, l in ["network", "home", "temp"])) ||
        shell.risks(hook.argv(payload)).size() > 0 ||
        shell.locations(hook.argv(payload)).exists(l, l in ["network", "home", "temp"])
  - severity: medium
    when: "true"
harness: [claude, generic]
files: ["**/skills/**/[Ss][Kk][Ii][Ll][Ll].[Mm][Dd]"]
when: |
  config.kind == "hook" && config.scope == "repo"
fix: "Move the hook out of the skill's frontmatter into the project's hook configuration (.claude/settings.json), where it is reviewed with the other hooks and runs only in a trusted workspace. If the skill needs a check, have its instructions call a committed script instead."
refs:
  - https://code.claude.com/docs/en/skills
  - https://code.claude.com/docs/en/hooks
  - https://workos.com/blog/npm-worm-coding-agent-config-credentials
