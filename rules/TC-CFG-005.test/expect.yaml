# The severities each positive fixture must produce (see
# internal/rules/fixtures.go, ExpectFile). A negative listed here must
# fail to evaluate instead of matching.
positivos:
  claude-bypass-and-skip-prompt: high
  claude-bypass-permissions: high
  claude-bypass-with-deny: high
  claude-nested-package: high
  claude-root-settings-beside-fixtures: [high, low]
  claude-settings-under-test-fixtures: low
  claude-skip-prompt-only: medium
  codex-approval-never: high
  codex-config-fixture-word-in-name: high
  codex-config-in-fixtures-wrong-case: high
  codex-config-in-myfixtures: high
  codex-danger-full-access: high
  codex-nested-service: high
  codex-profile-approval-never: high
  codex-profile-yolo: high
  gemini-auto-accept-string-mixed-case: medium
  gemini-default-approval-yolo: medium
  gemini-flat-auto-accept-string-upper: medium
  gemini-flat-auto-accept: medium
  gemini-tools-auto-accept: medium
