# An instructions file can tell the agent to read the environment, a
# dotenv file, or credentials, or to send that data to an outbound sink.
# The model follows the file. This is a heuristic over the text, not a
# proof that a session did either thing.
#
# Read, in repository scope, the same paths as TC-CFG-011:
# AGENTS.md, CLAUDE.md, and CLAUDE.local.md at any depth,
# .claude/rules/**/*.md, .windsurfrules, .cursorrules,
# .github/copilot-instructions.md, .github/instructions/**/*.md,
# .github/agents/**/*.agent.md, and .cursor/rules/**/*.md(c), plus
# repository SKILL.md files that the Claude and generic adapters emit,
# .claude/commands/**/*.md, .claude/agents/**/*.md, and
# .windsurf/rules/**/*.md, and knowledge contents in
# .devin/blueprint.yaml (the doc loads those into the agent's context).
# Blueprint initialize and maintenance text is shell input, read by
# TC-CFG-009, not instruction text. AGENTS.local.md and GEMINI.local.md are not
# included because no repository adapter emits them.
# The match is on the raw whole file, including frontmatter. The raw view
# is evaluation-only; findings contain only the line number, never text.
#
# Bidi controls (U+202A-U+202E, U+2066-U+2069) and zero-width characters
# (U+200B-U+200D, U+2060, U+FEFF) are removed before the match, so they
# cannot sit in front of a verb or split a target. Tag characters and
# lookalike letters, including a Cyrillic e in .env, stay and do not match.
# A line matches when a verb follows optional Markdown (#, >, <!--,
# bullet, number, or **, with a ** that closes bold right after the
# verb dropped), an optional role label after <!-- only
# (assistant, user, system, or human, then a colon), and an optional
# prefix (please, always, first, you must/should, make sure to), and
# then directly names a secret target. A label such as "Example:" is
# not a role, and a role label without the comment is not stripped.
# The read verbs are read, cat, cp, copy, open,
# load, source, printenv, print, dump, collect, extract, show, curl,
# wget, type, Get-Content, access, echo, get, retrieve, and the phrasal
# verb "look up". printenv matches on its own unless a
# documentation modifier follows, and it remains a target after another
# read verb. The targets are .env (also .env.local,
# .env.development, .env.production, .env.prod, and .env.dev),
# printenv, process.env, os.environ, "environment variable" or
# "environment variables", credentials, secret(s), api key, token,
# password, private key,
# ~/.aws, ~/.ssh, $HOME/.aws, $HOME/.ssh, ${HOME}/.aws, ${HOME}/.ssh,
# /home/<user>/.aws, /home/<user>/.ssh, /root/.aws, /root/.ssh, id_rsa,
# and AWS_*/GITHUB_TOKEN-style environment
# variables. A home path needs the directory in the next segment, so
# /home/<user>/project/.aws does not count. /proc/self/environ,
# /proc/$PPID/environ,
# /proc/${PPID}/environ, and /proc/<digits>/environ are targets.
# /proc/self/status, /proc/self/environment, /proc/self/../self/environ,
# and /proc/self/environ.example are not. .env.example, .env.sample,
# .env.template, and .envrc do not count.
# Between the verb and target, curl/wget flags, one URL, one or more
# determiners (the/all/your/any/every/each/its/their/those, a, an, and
# the rest), "contents/values of", and one quote, backtick, @, or
# PowerShell $env: prefix are allowed and do not by themselves open a
# new phrase. Up to 6 further words may sit in that same noun phrase.
# Every skipped token counts toward the 6, including a determiner. The
# walk stops at a negation or a new clause (not, never, if, when, and,
# before, and the rest), at a copula, auxiliary, or clause connective
# (is, won't, can, despite, because, and the rest), at a documentation word, and at a
# token that is not a plain word, a determiner, or a preposition.
# Hyphenated tokens are not plain words, so ".env.example",
# "docs/security.md", and "whitespace-delimited" are not skipped. A preposition after a content
# word also stops, so "read config via process.env" stays quiet. A
# secret followed by a documentation modifier still does not count, and
# the walk does not continue past that modifier.
# A secret value (credentials, secret, API key, token, password, private
# key, environment variables) names what is read, not where it is
# stored. It counts as a direct object of read, cat, print, and the
# other base verbs, with only determiners before it. Once any other word
# is skipped, and always after get, retrieve, access, or look up, a
# value counts only when "from", "in", "inside", "within", "under",
# "of", "via", or "using" and a local path follow it: "the service
# account credentials in ~/.config", "each API key from the .env file",
# and "the token via the .env file" match, while "read
# only named environment variables", "read current secret", "get an API
# key at https://...", "get the API key from 1Password", "get the API
# key using the CLI", and "look up secrets in Notion" do not. A storage
# target (.env, ~/.ssh, ~/.aws, /proc/*/environ, process.env,
# os.environ, id_rsa, AWS_*, GITHUB_TOKEN) needs no path after it. echo matches only a secret value: a quoted
# literal, a path such as .env, or output redirected with > is printed or
# written, not read. "access token" and "access key", with
# nothing between the words, are compound nouns. The verb still has to
# start the line, and the target has to be on that same line. curl and wget also match when a
# secret appears anywhere later in the same clause, so a flag value
# such as "-d @.env" still counts. Authorization and user flags
# (-H/--header, -u/--user, --oauth2-bearer) and plain http(s) URLs are
# ignored, including a flag glued to a quoted value
# (-H"X-Api-Token: $TOKEN"), an equals form
# (--header=Authorization: Bearer $TOKEN), and an unquoted header
# whose value continues past the colon
# (-H Authorization: Bearer $TOKEN). That unquoted value ends at a
# shell operator, at an input redirect (< .env, 0<.env, <<<), and at a
# $(...) or backtick after it. A value glued to the name
# (Authorization:$(cat .env), Authorization:"$(cat .env)") ends at the
# same stops; a single-quoted part is a literal and is skipped. -H @.env
# sends the file as headers, so a value that starts with @ is kept. A
# value that opens with a quote is ignored whole, so a $(...) inside
# -H "X-Api-Token: $(cat .env)" stays quiet. A $(...) or backtick that
# the curl or wget command keeps also counts when it names any local
# path ($(cat ./secrets/token)); $(uuidgen) does not. A URL containing $( or a backtick is kept, so
# $(cat .env) inside it still counts. A secret value that is the
# direct object, and whose tail says "come from" or "comes from"
# without naming a local path, is an origin ("Source credentials for
# the bteq run come from the connection"), not a request to source a
# file. "Source the credentials from .env" and "Source
# `.env.production`" still count. Documentation modifiers after the
# target, singular or plural (for example "token budgets", "API key
# policies", or "credentials section"), do not count.
#
# A line also matches when it begins with send, post, upload,
# exfiltrate, transmit, or forward and, on that same line, both names a
# secret and an outbound sink: an http(s) URL, webhook, curl/wget with
# -d/--data/-F/POST, gist, pastebin, Slack, Discord, or "... to".
# A repository skill, or a Claude-emitted agent or command, is in scope
# even when it lives below a plugin root outside the usual path set.
#
# Low: the wording is ordinary setup prose as often as it is an
# exfiltration instruction, and scan mode cannot see whether a session
# followed it. It is reported for review without failing a scan at the
# default fail-on (high).
id: TC-CFG-012
pack: tripcord/core
title: "Agent instructions ask to read secrets or send them out"
severity: low
evidence: instruction_match
harness: [claude, copilot, cursor, gemini, windsurf, generic, devin]
files: ["**"]
when: |
  config.kind in ["instructions", "skill"] && config.scope == "repo" &&
    has(payload.content) && type(payload.content) == string &&
    (config.kind == "skill" || (has(payload.role) && payload.role in ["agent", "command"]) ||
      config.path.matches(r'''(?i)((^|/)(AGENTS|CLAUDE(\.local)?)\.md|(^|/)GEMINI\.md|(^|/)\.claude/rules/.+\.md|(^|/)\.claude/(commands|agents)/.+\.md|(^|/)\.claude/skills/.+/SKILL\.md|(^|/)\.agents/skills/.+/SKILL\.md|(^|/)\.github/skills/.+/SKILL\.md|(^|/)\.windsurfrules|^\.cursorrules|^\.github/copilot-instructions\.md|^\.github/instructions/.+\.md|^\.github/agents/.+\.agent\.md|(^|/)\.cursor/rules/.+\.mdc?|(^|/)\.windsurf/rules/.+\.md|(^|/)\.devin/blueprint\.yaml)$''')) &&
    (config.harness != "devin" || (has(payload.role) && payload.role == "knowledge")) &&
    instruction.first_match_line(payload.content) > 0
fix: "Delete the instruction that reads the environment, a dotenv file, or credentials, or that sends them to an outbound sink. Keep notes that only name .env.example or tell the agent not to reveal secrets. To accept a reviewed file, add a policy exception for this rule and file."
refs:
  - https://novee.security/blog/breaking-ai-agent-sandboxes/
  - https://fidelius.blisslabs.dev/research/ai-coding-agents-api-keys-env/
  - https://docs.devin.ai/onboard-devin/environment/blueprints
