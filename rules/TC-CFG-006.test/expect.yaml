# The severities each positive fixture must produce (see
# internal/rules/fixtures.go, ExpectFile). An unlisted negative must not
# match and must evaluate. A negative listed as error must fail to
# evaluate instead of matching. An object argument is not that error:
# its scalar siblings still match, which is why copilot-exec-object-arg
# is a positive.
positivos:
  copilot-exec-object-arg: high
  claude-agent-frontmatter: high
  claude-bash-tmp-payload: high
  claude-home-script: high
  claude-http-remote: high
  claude-node-home-module: high
  claude-opt-script: medium
  claude-parent-dir: medium
  claude-plugin-hooks-json: high
  claude-project-dir-escape: medium
  claude-unc-command: high
  codex-config-toml-tmp: high
  codex-hooks-json-home: high
  copilot-bash-home: high
  copilot-exec-args-tmp: high
  copilot-exec-numeric-arg: high
  copilot-powershell-temp: high
  copilot-powershell-unc: high
  cursor-absolute-users: high
  cursor-home-script: high
  cursor-unc-quoted: high
  gemini-tmp-script: high
  missing-claude-project-dir: medium
  missing-codex-hooks-json: medium
  missing-copilot-cwd: medium
  missing-copilot-exec-args: medium
  missing-cursor-node-script: medium
  missing-gemini-project-dir: medium
