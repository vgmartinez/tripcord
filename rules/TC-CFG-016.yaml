# A hook-based guard, including the one `tripcord init --embed`
# registers, only runs when the harness
# actually invokes hooks at all. A shared setting that turns every hook
# off defeats that regardless of which hook is the guard, so it is a
# precondition worth flagging on its own, before Tripcord has any hook
# installed to be deleted.
#
# Claude Code and Copilot both normalize a shared disableAllHooks: true
# as a permissions setting. Gemini CLI's equivalent is
# hooksConfig.enabled: false (hooksConfig.disabled only names specific
# hooks by id and is not read here, the same way this pack does not try
# to tell which hook a partial disable targets).
#
# Cursor and Windsurf have no disable-all clause: neither documents a
# file-level key that turns every hook off. Cursor's only global hooks
# option is version; Windsurf's Cascade handler fields have no such
# key. See docs/rules/TC-CFG-016.md. No key is guessed here. Cursor is
# in harness for the embed clause below only.
#
# The second clause is the single-tree embed case (issue #39). When the
# repository holds a Tripcord embed (.tripcord/bootstrap.sh or
# .tripcord/embed.json), the scan compares each hook that
# `tripcord init --embed` wrote for the harnesses the manifest records
# (Claude Code, Cursor, Copilot) with the canonical entry, by SHA-256
# (internal/embedded). A hook that is missing, edited, or in a file that
# no longer parses becomes a permissions item with setting
# tripcordGuard at that wiring file. Only harnesses selected at init
# time are checked.
#
# What this rule does not do: tell whether a hook that used to be
# present in a base tree was removed when the embed itself was removed
# too. That needs a base tree to diff against; see
# docs/rules/TC-CFG-016.md.
#
# settings.local.json is personal and is not part of this rule's files,
# the same exclusion TC-CFG-004 and TC-CFG-005 make for Claude Code.
id: TC-CFG-016
pack: tripcord/core
title: "Shared config turns off every hook"
severity: high
harness: [claude, copilot, cursor, gemini]
files:
  - "**/.claude/settings.json"
  - "**/.github/copilot/settings.json"
  - "**/.github/hooks/*.json"
  - "**/.gemini/settings.json"
  - "**/.cursor/hooks.json"
when: |
  config.kind == "permissions" && config.scope == "repo" && has(payload.setting)
severity_when:
  - severity: high
    when: |
      has(payload.setting) && (
        (config.harness in ["claude", "copilot"] && payload.setting == "disableAllHooks" &&
          has(payload.value) && payload.value == true) ||
        (config.harness == "gemini" && payload.setting == "hooksConfig" &&
          has(payload.value) && type(payload.value) == map &&
          has(payload.value.enabled) && payload.value.enabled == false))
  - severity: high
    title: "Tripcord embed is missing its own hook"
    when: |
      has(payload.setting) && config.harness in ["claude", "copilot", "cursor"] && payload.setting == "tripcordGuard"
fix: "Remove disableAllHooks (Claude Code, Copilot) or hooksConfig.enabled: false (Gemini CLI) from the shared file. Disabling every hook also disables any hook-based guard the harness would otherwise run, including Tripcord's own; to pause a single hook, remove that hook's own entry or use the harness's managed-hooks allow list instead of a blanket switch. When the finding is a missing Tripcord hook, restore it with `tripcord init --embed` (add --force to replace an edited one), or remove the harness from .tripcord/embed.json if it is no longer used."
refs:
  - https://code.claude.com/docs/en/hooks
  - https://docs.github.com/en/copilot/reference/hooks-reference
  - https://geminicli.com/docs/
  - https://cursor.com/docs/hooks
  - https://novee.security/blog/breaking-ai-agent-sandboxes/
