# A bidi control, a Unicode tag character, or a zero-width code point
# in an agent instructions file is invisible in an editor and in a
# pull-request diff, but the model reads it: bidi controls reorder what
# a reviewer sees, tag characters (U+E0000-U+E007F) spell ASCII text no
# one sees, and zero-width code points hide or split words.
#
# Read, in repository scope, as raw bytes including frontmatter:
# AGENTS.md, CLAUDE.md, CLAUDE.local.md, and GEMINI.md at any depth,
# .claude/rules/**/*.md, .windsurfrules, .cursorrules,
# .github/copilot-instructions.md, .github/instructions/**/*.md,
# .github/agents/**/*.agent.md, and .cursor/rules/**/*.md(c).
# Repository skills are read only at .claude/skills/<name>/SKILL.md,
# .agents/skills/<name>/SKILL.md, and .github/skills/<name>/SKILL.md.
# docs/SKILL.md and a Claude plugin's skills/ directory are not.
#
# Code points: U+202A-U+202E and U+2066-U+2069 (bidi), U+E0000-U+E007F
# (tags), U+200B-U+200D, U+2060, and U+FEFF (zero-width), except a BOM
# that starts the file. A U+200D between Extended_Pictographic
# characters is not counted; U+FE0F and skin tones may sit beside it.
# U+200E/U+200F marks are not counted.
#
# An isolated U+200B, U+200C, or U+200D is not counted only when both
# neighbors are whitespace, a line boundary, or the edge of a quote or
# a code fence of three or more backticks or tildes, and it is not part
# of a zero-width run. A quoted string or bracket class made only of
# zero-width characters is a strip literal and is not counted when that
# span has at most 8 code points and no code point repeats. A longer
# span or a repeated code point is a run and stays counted. A
# zero-width character next to punctuation, after a dot, before a word,
# or at the end of a word stays counted. Tags, bidi controls, zero-width
# runs, and U+2060 or U+FEFF outside a strip literal stay counted.
#
# The excerpt names each run's code point, line, and column (code
# points from 1), never the text the run hides or spells: a tag run is
# named by its block. See internal/hiddenchar.
id: TC-CFG-011
pack: tripcord/core
title: "Hidden Unicode in an agent instructions file"
severity: high
evidence: hidden_chars
harness: [claude, copilot, cursor, gemini, windsurf, generic, devin]
files: ["**"]
when: |
  config.scope == "repo" && config.hidden_chars > 0 &&
    config.kind in ["instructions", "skill"] &&
    (
      (config.kind == "instructions" && config.path.matches(r'''(?i)((^|/)(AGENTS|CLAUDE|GEMINI)(\.local)?\.md|(^|/)\.claude/rules/.+\.md|(^|/)\.windsurfrules|^\.cursorrules|^\.github/copilot-instructions\.md|^\.github/instructions/.+\.md|^\.github/agents/.+\.agent\.md|(^|/)\.cursor/rules/.+\.mdc?|(^|/)\.devin/blueprint\.yaml)$''')) ||
      (config.kind == "skill" && config.path.matches(r'''(?i)((^|/)\.claude/skills/.+/SKILL\.md|(^|/)\.agents/skills/.+/SKILL\.md|(^|/)\.github/skills/.+/SKILL\.md)$'''))
    )
fix: "Remove the hidden code points (the finding names each one's line and column), then review the instructions as they read without them. If a non-Latin script needs a direction mark, use U+200E or U+200F."
refs:
  - https://trojansource.codes/
  - https://www.unicode.org/reports/tr9/
  - https://www.unicode.org/charts/PDF/UE0000.pdf
  - https://embracethered.com/blog/posts/2024/hiding-and-finding-text-with-unicode-tags/
  - https://docs.devin.ai/onboard-devin/environment/blueprints
