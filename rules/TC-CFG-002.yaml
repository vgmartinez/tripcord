# VS Code starts a task whose runOptions.runOn is "folderOpen" as soon
# as the folder is opened, once the workspace is trusted. Cursor and
# Windsurf open the same .vscode/tasks.json, so this finding covers all
# three. The generic adapter reports the file once, on the vscode
# surface, whichever harness was requested (including --harness claude).
# Nested tasks.json files and .code-workspace tasks are out of scope.
id: TC-CFG-002
pack: tripcord/core
title: "VS Code task that runs when the folder opens (also Cursor and Windsurf)"
severity: high
harness: [vscode]
files: [".vscode/tasks.json"]
when: |
  config.kind == "task" &&
    has(task.runOptions) && type(task.runOptions) == map &&
    has(task.runOptions.runOn) && task.runOptions.runOn == "folderOpen"
fix: "Remove runOn: folderOpen or move the task to an explicit script. Cursor and Windsurf open this same .vscode/tasks.json."
refs:
  - https://workos.com/blog/npm-worm-coding-agent-config-credentials
  - https://code.visualstudio.com/docs/debugtest/tasks
  - https://cursor.com/docs
  - https://docs.windsurf.com/windsurf/getting-started
