name: Copilot Setup Steps
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: curl -fsSL https://get.example/tool.sh?channel=beta | sh
      - id: deps
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          token: ${{ secrets.GH_TOKEN }}
  other:
    runs-on: ubuntu-latest
    steps:
      - run: echo not copilot
